function landing(){$('#root').innerHTML=`<div class="land"><span class="demo">Proposed concept · not an existing ISRE product · all records are demo data</span>
<h1>Complete Visibility. Smarter Project Management.</h1><p class="s">Bring construction projects, property inspections, documentation and client collaboration into one connected workspace.</p>
<h2 style="margin-top:28px">Sign in as (demo role selector)</h2><div class="roles">${Object.keys(RN).map(r=>`<div class="card ${r==sel?'on':''}" onclick="sel='${r}';landing()"><b>${RN[r]}</b></div>`).join('')}</div>
<button class="btn" onclick="login()">Continue to workspace</button></div>`}
function login(){toast('Signed in as '+RN[sel]+' (demo)');role=sel;view=NAV[role][0][0];shell()}
function shell(){$('#root').innerHTML=`<div id="app"><nav><b><img class='lgo' src='${LOGO}' alt='ISRE'><small>Project Hub</small></b>${NAV[role].map(([k,l])=>`<a class="${k==view?'on':''}" onclick="go('${k}')">${l}</a>`).join('')}<a onclick="landing()">⇄ Switch role</a></nav><main id="m"></main></div>`;draw()}
function go(v){view=v;shell()}
function draw(){const f={dash,proj:projV,insp,con:conV,ai,ana,cli}[view];$('#m').innerHTML=`<div class="top"><div>${f.h}</div><div>${DEMO} <span class="bd">${RN[role]}</span></div></div>`+f();after()}
function after(){document.querySelectorAll('[data-n]').forEach(e=>{const t=+e.dataset.n;let i=0;const x=setInterval(()=>{i++;e.textContent=Math.round(t*i/20);if(i>=20)clearInterval(x)},30)});setTimeout(()=>document.querySelectorAll('.bar i[data-w]').forEach(e=>e.style.width=e.dataset.w+'%'),50)}
const bar=p=>`<div class="bar"><i style="width:0" data-w="${p}"></i></div>`;

function dash(){const k=[['Active Projects',14],['Pending Inspections',6],['Active Contractors',23],['Outstanding Approvals',5]];
return `<div class="g4">${k.map(([l,n])=>`<div class="card"><div class="mu">${l}</div><div class="k" data-n="${n}">0</div><div class="mu">▲ demo trend</div></div>`).join('')}</div>
<div class="g2"><div class="card"><h2>Project performance (% complete)</h2>${P.map(p=>`<div style="margin:8px 0"><div class="mu">${p.n} · ${p.p}%</div>${bar(p.p)}</div>`).join('')}</div>
